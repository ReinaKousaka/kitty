# Remote-side companion to tmux_sync.py (optional; kitty mappings work without it)
# Install: scp tmux.conf <host>:~/.tmux.conf   (then `tmux source ~/.tmux.conf`)

set -g mouse on
set -g set-clipboard on

# System clipboard: every copy (mouse drag, M-w, vi y/Enter) also goes to the
# X clipboard via xclip; OSC 52 above still covers SSH sessions without xclip.
if-shell "command -v xclip" "set -s copy-command 'xclip -selection clipboard -i'"
# Kitty advertises xterm-256color over SSH; let tmux send OSC 52 to it
set -as terminal-features ",xterm-256color:clipboard,xterm-kitty:clipboard"
# vi-style selection in copy mode: v to start, y to copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
# prefix + P pastes from the system clipboard
bind P run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"

# True color through tmux (delta / git diff backgrounds render black without it).
# Takes effect on re-attach; panes opened before keep their old TERM.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -ga update-environment "COLORTERM"

# Preserve Shift+Enter for Codex and other apps using extended keyboard input.
set -s extended-keys always
set -s extended-keys-format csi-u
# Kitty is configured to advertise xterm-256color, including over SSH.
set -as terminal-features ",xterm-256color:extkeys,xterm-kitty:extkeys"

# Set the outer terminal title to "tmux: ..." so kitty's `title:^tmux` match
# keeps working even while vim/less/etc. run inside a pane
set -g set-titles on
set -g set-titles-string "tmux: #S - #W"

# Splits and new windows open in the current directory (like kitty --cwd=current)
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Close pane without the y/n confirmation
bind x kill-pane

# Nord theme (https://github.com/nordtheme/tmux); uses the terminal's Nord palette from kitty nord.conf
# Install: git clone https://github.com/nordtheme/tmux ~/.tmux/themes/nord-tmux
if-shell "test -f ~/.tmux/themes/nord-tmux/nord.tmux" "run-shell 'bash ~/.tmux/themes/nord-tmux/nord.tmux'"

# Arc (rounded) separators instead of Nord's arrows: powerline U+E0B0-E0B3 -> U+E0B4-E0B7
set -gF status-left "#{s///:#{s///:#{s///:#{s///:status-left}}}}"
set -gF status-right "#{s///:#{s///:#{s///:#{s///:status-right}}}}"
set -gF window-status-format "#{s///:#{s///:#{s///:#{s///:window-status-format}}}}"
set -gF window-status-current-format "#{s///:#{s///:#{s///:#{s///:window-status-current-format}}}}"

# Always point GUI apps (OpenRAVE/Qt viewers) at the local desktop on :1, even
# when attaching over SSH: don't let the attaching client overwrite DISPLAY/XAUTHORITY.
set -gu update-environment
set -g update-environment "KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID COLORTERM"
set-environment -g DISPLAY :1
set-environment -g XAUTHORITY /run/user/1000/gdm/Xauthority
